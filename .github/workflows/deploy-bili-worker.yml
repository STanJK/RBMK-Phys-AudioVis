name: deploy-bili-worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-bili-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy

      - name: Smoke test deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "Worker URL: $DEPLOYMENT_URL"

          echo "::group::health"
          curl --fail-with-body --silent --show-error "$DEPLOYMENT_URL/health"
          echo
          echo "::endgroup::"

          echo "::group::resolve smoke"
          curl --fail-with-body --silent --show-error             "$DEPLOYMENT_URL/resolve?bvid=BV1VGYR6bECg&p=1"
          echo
          echo "::endgroup::"

      - name: Publish deployment summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Bilibili Worker deployed"
            echo
            echo "- URL: `$DEPLOYMENT_URL`"
            echo "- Health: `$DEPLOYMENT_URL/health`"
            echo
            echo "The production frontend already embeds this Worker URL as its default fallback."
          } >> "$GITHUB_STEP_SUMMARY"
