name: deploy-bili-worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-bili-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy

      - name: Smoke test deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "Worker URL: $DEPLOYMENT_URL"

          echo "::group::health"
          curl --fail-with-body --silent --show-error "$DEPLOYMENT_URL/health"
          echo
          echo "::endgroup::"

          echo "::group::resolve smoke"
          RESOLVE_JSON="$(curl --fail-with-body --silent --show-error "$DEPLOYMENT_URL/resolve?bvid=BV1VGYR6bECg&p=1")"
          echo "$RESOLVE_JSON"
          PROXY_URL="$(printf '%s' "$RESOLVE_JSON" | jq -r '.proxyUrl // empty')"
          test -n "$PROXY_URL"
          echo "::endgroup::"

          echo "::group::stream smoke"
          curl --fail-with-body --silent --show-error             --range 0-0             --output /dev/null             "$PROXY_URL"
          echo "stream range request ok"
          echo "::endgroup::"

      - name: Publish deployment summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Bilibili Worker deployed"
            echo
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Health: $DEPLOYMENT_URL/health"
            echo
            echo "The production frontend embeds this Worker as its sole Bilibili resolver."
          } >> "$GITHUB_STEP_SUMMARY"
