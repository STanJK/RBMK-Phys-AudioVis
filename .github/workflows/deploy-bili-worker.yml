name: deploy-bili-worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy

      - name: Smoke test deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "Worker URL: $DEPLOYMENT_URL"

          echo "::group::health"
          curl --fail-with-body --silent --show-error "$DEPLOYMENT_URL/health"
          echo
          echo "::endgroup::"

          echo "::group::resolve smoke"
          RESOLVE_BODY="$(mktemp)"
          RESOLVE_STATUS="$(curl             --silent             --show-error             --retry 4             --retry-delay 2             --retry-max-time 30             --output "$RESOLVE_BODY"             --write-out '%{http_code}'             "$DEPLOYMENT_URL/resolve?bvid=BV1VGYR6bECg&p=1" || true)"
          echo "HTTP $RESOLVE_STATUS"
          cat "$RESOLVE_BODY"
          echo
          if [ "$RESOLVE_STATUS" -lt 200 ] || [ "$RESOLVE_STATUS" -ge 300 ]; then
            echo "::error::resolve smoke failed with HTTP $RESOLVE_STATUS"
            rm -f "$RESOLVE_BODY"
            exit 1
          fi
          RESOLVE_JSON="$(cat "$RESOLVE_BODY")"
          rm -f "$RESOLVE_BODY"
          STREAM_URL="$(printf '%s' "$RESOLVE_JSON" | jq -r '.streamUrl // empty')"
          test -n "$STREAM_URL"
          echo "::endgroup::"

          echo "::group::stream smoke"
          STREAM_STATUS="$(curl             --silent             --show-error             --retry 3             --retry-delay 2             --retry-max-time 20             --range 0-0             --output /dev/null             --write-out '%{http_code}'             "$STREAM_URL" || true)"
          echo "HTTP $STREAM_STATUS"
          if [ "$STREAM_STATUS" -lt 200 ] || [ "$STREAM_STATUS" -ge 400 ]; then
            echo "::error::stream smoke failed with HTTP $STREAM_STATUS"
            exit 1
          fi
          echo "stream range request ok"
          echo "::endgroup::"

      - name: Publish deployment summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Bilibili Worker deployed"
            echo
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Health: $DEPLOYMENT_URL/health"
            echo
            echo "The production frontend embeds this Worker as its sole Bilibili resolver."
          } >> "$GITHUB_STEP_SUMMARY"
